[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilldoctor"
version = "0.1.1"
description = "Lint Agent Skills (SKILL.md) for spec errors, typo keys, and weak descriptions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "agent-skills", "cli", "linter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/skilldoctor"
Repository = "https://github.com/perron/skilldoctor"
Issues = "https://github.com/perron/skilldoctor/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skilldoctor = "skilldoctor.cli:main"

[tool.setuptools.packages.find]
include = ["skilldoctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
