[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilleval"
version = "0.1.1"
description = "Deterministic A/B eval harness for agent skills. No API key required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "agent-skills", "cli", "eval"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/skilleval"
Repository = "https://github.com/perron/skilleval"
Issues = "https://github.com/perron/skilleval/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skilleval = "skilleval.cli:main"

[tool.setuptools.packages.find]
include = ["skilleval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
