<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%TITLE%% - mycelium</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0a0f0d;--bg2:#12201a;--fg:#e1ece6;--muted:#8da39a;--panel:rgba(13,22,18,.88);--line:#27382f;--accent:#58e0c8;--halo:#0a0f0d}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f1eee3;--bg2:#fbf9f0;--fg:#1c2923;--muted:#5a6a62;--panel:rgba(255,253,245,.92);--line:#d6d1bb;--accent:#0b7a6c;--halo:#f1eee3}}
:root[data-theme=light]{--bg:#f1eee3;--bg2:#fbf9f0;--fg:#1c2923;--muted:#5a6a62;--panel:rgba(255,253,245,.92);--line:#d6d1bb;--accent:#0b7a6c;--halo:#f1eee3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,var(--bg2),var(--bg) 70%);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.hover{cursor:pointer}canvas.drag{cursor:grabbing}
.box{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#left{position:fixed;top:12px;left:12px;width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;pointer-events:none;scrollbar-width:none}
#left>.box{position:static;pointer-events:auto}
#head{padding:12px 14px}
#head h1{font-size:17px;margin:0 0 2px;letter-spacing:.2px}#head p{margin:0 0 8px;color:var(--muted);font-size:12.5px}
input[type=search]{width:100%;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg)}
input[type=search]:focus-visible,button:focus-visible,a:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}.chip.off{opacity:.42;text-decoration:line-through}
#tools{top:12px;right:12px;display:flex;gap:6px;padding:6px}
#tools a,#tools button{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);text-decoration:none;cursor:pointer}
#tools a:hover,#tools button:hover,.chip:hover{border-color:var(--accent)}
#depth[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
#panel{top:64px;right:12px;width:min(310px,calc(100vw - 24px));padding:14px;max-height:calc(100vh - 170px);overflow:auto}
#panel[hidden]{display:none}#panel h2{font-size:16px;margin:0 0 2px;padding-right:22px}#panel .rel{color:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
#panel dl{margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}#panel dt{color:var(--muted)}#panel dd{margin:0}
#panel .warn{color:#e6a45c}#panel .open{display:inline-block;margin:4px 0 8px;color:var(--accent)}
#panel .sum{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-top:4px}#panel .sum span{flex:1;white-space:pre}
#panel .sum a{color:var(--accent)}#panel .sum button{font:inherit;font-size:12.5px;padding:2px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer}
#panel .det .open{display:none}
#panel.min h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}#panel.min .rel,#panel.min .det{display:none}
#panel h2{cursor:pointer}
#left>#head{position:relative}#head h1{padding-right:26px}
#fold{position:absolute;top:9px;right:9px;width:24px;height:24px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0}
#fold:hover{border-color:var(--accent);color:var(--fg)}
@media (min-width:641px){#head.fold #q,#head.fold #legend{display:none}#head.fold p{margin:0}}
#panel .side{color:var(--muted);font-size:12px;margin:8px 0 4px}#panel .nb{display:flex;flex-wrap:wrap;gap:4px}#panel .nb button{font:inherit;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
#close{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
#time{padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
#time[hidden]{display:none}
#time button{font:inherit;padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;min-width:84px}
#time button:hover{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
#when{font-size:12.5px;color:var(--muted);white-space:nowrap;justify-self:end}#slide{grid-column:1/-1}
#what{grid-column:1/-1;font-size:12.5px;line-height:1.4;min-height:2.8em;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#speedl{grid-column:1/-1;font-size:12px;color:var(--muted)}
#time select{font:inherit;font-size:12px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted)}
#find{display:none}
@media (max-width:640px){
#left{display:contents}#left>.box{position:fixed}
/* header: title and counts only; search and legend open with Find */
#left>#head{position:fixed}#fold{display:none}
#head{top:12px;left:12px;width:calc(100vw - 24px);padding:8px 12px}
#head h1{font-size:15px;margin:0;padding-right:196px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head p{margin:0;font-size:11.5px}
#head:not(.open) #q,#head:not(.open) #legend{display:none}
#head.open #q{margin-top:8px}#legend{max-height:96px;overflow:auto}
#tools{top:17px;right:20px;padding:0;background:none;border:0;backdrop-filter:none;gap:5px}
#tools a,#tools button{padding:3px 8px;font-size:12px}#find{display:inline-block}
#find[aria-expanded=true]{border-color:var(--accent)}
/* replay: one row of controls and one line of text */
#time{bottom:12px;left:12px;right:12px;padding:6px 10px;gap:3px 8px;grid-template-columns:auto 1fr auto;grid-template-areas:"p s v" "w x x";align-items:center}
#play{grid-area:p;min-width:0;padding:3px 12px}#slide{grid-area:s;grid-column:auto;margin:0}#speedl{grid-area:v;grid-column:auto}#speedl .lbl{display:none}
#when{grid-area:w;justify-self:start;font-size:11.5px}
#what{grid-area:x;grid-column:auto;min-height:0;display:block;white-space:nowrap;text-overflow:ellipsis;font-size:11.5px;color:var(--muted);cursor:pointer}
#what.full{white-space:normal}
#panel{top:auto;right:12px;left:12px;bottom:92px;width:auto;max-height:34vh;padding:10px 14px}
.notime #panel{bottom:12px}
}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Graph of the notes: each note is a node, each mention between notes is a thread. The list of all notes follows for keyboard and screen reader use."></canvas>
<div id="empty">No notes to draw yet.</div>
<div id="left"><div id="head" class="box"><button id="fold" type="button" aria-expanded="true" aria-controls="head" title="Hide the search and the legend">&minus;</button><h1>%%TITLE%%</h1><p id="stats"></p>
<input id="q" type="search" placeholder="Find a note..." aria-label="Find a note"><div id="legend" role="group" aria-label="Show or hide a group of notes"></div></div>
<div id="time" class="box" hidden><button id="play" type="button">Replay</button><span id="when"></span><input id="slide" type="range" min="0" value="0" aria-label="Position in the history of the notes"><div id="what"></div><label id="speedl"><span class="lbl">Speed </span><select id="speed" aria-label="Replay speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select></label></div></div>
<div id="tools" class="box"><button id="find" type="button" aria-expanded="false" aria-controls="head">Find</button><a href="index.html">Map</a><button id="fit" type="button" title="Fit the whole network in view">Fit</button><button id="depth" type="button" aria-pressed="true" title="Depth: recently changed notes float in front, notes untouched for longest sink to the back. Turn the view with Shift-drag, two fingers moved together, or a sideways trackpad swipe; Fit turns it back.">Depth</button><button id="theme" type="button" title="Switch light and dark">Theme</button></div>
<aside id="panel" class="box" hidden aria-live="polite"></aside>
<nav class="sr" aria-label="All notes"><ul>%%LINKS%%</ul></nav>
<script id="data" type="application/json">%%DATA%%</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var cv=document.getElementById("c"),cx=cv.getContext("2d");
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var NODES=D.nodes,NN=NODES.length,NC=D.commits.length;
var root=document.documentElement;

/* ---------- theme ---------- */
var DARK_PAL=["#4fe3cf","#ffb454","#b79cff","#ff7f96","#a6e86a","#62beff","#ecd77f","#ff9d73","#7fe0a0","#e58cd9"];
var LIGHT_PAL=["#0f8f80","#c27410","#7a55d8","#cc3d5d","#5a9a1b","#1b73c4","#a08a14","#c2582b","#2d9a5e","#a8399c"];
var T={};
function pickTheme(){
  var p=new URLSearchParams(location.search).get("theme"),s=null;
  try{s=localStorage.getItem("myco-graph-theme")}catch(e){}
  var t=p||s;
  if(t==="light"||t==="dark")root.setAttribute("data-theme",t);
}
function readTheme(){
  var attr=root.getAttribute("data-theme");
  var dark=attr?attr==="dark":!(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
  T=dark?{dark:true,pal:DARK_PAL,hypha:"140,232,205",wilt:"#b9824a",halo:"#0a0f0d",text:"#e1ece6"}
        :{dark:false,pal:LIGHT_PAL,hypha:"30,105,88",wilt:"#8f5f2d",halo:"#f1eee3",text:"#1c2923"};
  sprites={};
  paintLegend();
}
var sprites={};
function sprite(color){
  if(sprites[color])return sprites[color];
  var c=document.createElement("canvas");c.width=c.height=96;var g=c.getContext("2d");
  var r=g.createRadialGradient(48,48,0,48,48,48);r.addColorStop(0,color);r.addColorStop(.35,color+"88");r.addColorStop(1,color+"00");
  g.fillStyle=r;g.fillRect(0,0,96,96);sprites[color]=c;return c;
}

/* ---------- model ---------- */
var hidden={},adj=[],E=[];
function hash(i){var s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
NODES.forEach(function(n,i){
  n.i=i;n.vis=false;n.ap=0;n.vx=0;n.vy=0;n.touch=-1;n.z=n.zt=.5;n.px=n.py=0;n.ps=1;n.pz=0;n.pr=n.r||1;
  var a=i*2.399963,r=24*Math.sqrt(i+1);n.x0=n.x=Math.cos(a)*r;n.y0=n.y=Math.sin(a)*r;
  n.r=(3.4+Math.min(7,Math.sqrt(n.in)*1.7)+Math.min(2.5,Math.log10(1+n.kb)*1.2)+(n.hub?2.5:0))*(n.hist?.8:1);
  n.low=(n.name+" "+n.title+" "+n.rel).toLowerCase();adj.push([]);
});
D.edges.forEach(function(e,k){
  /* dir: 1 = a mentions b, -1 = b mentions a, 0 = they mention each other */
  var a=NODES[e[0]],b=NODES[e[1]],o={a:a,b:b,w:e[2]+e[3],k:k,off:(hash(k)-.5)*.34,dir:e[2]&&e[3]?0:e[2]?1:-1};
  E.push(o);adj[a.i].push({n:b,e:o,out:e[2]>0,inn:e[3]>0});adj[b.i].push({n:a,e:o,out:e[3]>0,inn:e[2]>0});
});
var cur=NC;                                   /* commits applied: 0..NC */
var hov=-1,sel=-1,match=null,alpha=1,playing=false,acc=0,ripples=[];
var cam={x:0,y:0,k:1,tx:0,ty:0,tk:1},autoFit=true,W=0,H=0,DPR=1,lastT=0,VS=1;
function gcol(g){return T.pal[g%T.pal.length]}

/* ---------- depth ----------
   The notes float at different depths: the most recently changed ones in front, the ones untouched for longest at the back,
   smaller, fainter and without their shine. Depth is a rank among the notes in view (ties share it), so it spreads evenly
   whatever the project's pace, and a replay pulls each commit's notes forward while the rest recede. The camera looks from
   slightly above and sways a little (not with reduced motion); panning tilts it; Shift-drag, two fingers moved together (one
   finger pans) or a sideways trackpad swipe turn it, all the way round, and tilt it up to about 70 degrees (never over the
   top). The network turns about its own centre; notes fade with their distance from the viewer, so from behind the oldest
   notes are the near, bright ones. Fit (or a double-click) turns it back to the front. With the Depth button off, the
   projection is exactly the flat view. */
var depthOn=true,depthAmt=1,rot={x:0,y:0,home:false},tilt={x:0,y:0},ZS=0,cyw=1,syw=0,cpt=1,spt=0,C=null;
function depthTargets(){
  var vs=NODES.filter(function(n){return n.vis&&n.touch>=0}).sort(function(a,b){return b.touch-a.touch}),m=Math.max(1,vs.length-1),k0=0;
  NODES.forEach(function(n){if(n.touch<0)n.zt=1});
  vs.forEach(function(n,k){if(k&&n.touch!==vs[k-1].touch)k0=k;n.zt=Math.max(0,Math.min(1,.8*k0/m+.2*hash(n.i+11)))});
}
function proj(x,y,z){   /* world position and depth (0 front, 1 back) -> [screen x, screen y, scale, distance after turning, apparent x, apparent y] */
  var ax=x,ay=y,sc=1,Z2=0;
  if(depthAmt>0&&C){   /* turn about the network's centre, then look at the result like a flat picture: the camera pans and zooms it */
    var X=x-C.x,Y=(y-C.y)*VS,Z=(z-.5)*ZS*depthAmt,X1=X*cyw+Z*syw,Z1=Z*cyw-X*syw,Y1=Y*cpt-Z1*spt,f=ZS*1.9;
    Z2=Z1*cpt+Y*spt;sc=f/Math.max(f*.3,f+Z2);ax=C.x+X1*sc;ay=C.y+Y1*sc/VS;
  }
  return [(ax-cam.x)*cam.k+W/2,(ay-cam.y)*cam.k*VS+H/2,sc,Z2,ax,ay];
}
function turnTo(ry,rx){rot.home=false;rot.y=ry;rot.x=Math.max(-1.45,Math.min(1,rx))}   /* left-right without limit; up-down to about 70 degrees either way (the view already looks from slightly above) */
function turnHome(){rot.home=true}
function project(now,dt){
  var tg=depthOn?1:0;depthAmt+=(tg-depthAmt)*(reduce?1:Math.min(1,dt/260));if(Math.abs(tg-depthAmt)<.003)depthAmt=tg;
  tilt.x*=.93;tilt.y*=.93;
  if(rot.home){   /* back to the front by the shortest way round */
    var gy=Math.round(rot.y/6.2832)*6.2832,e=reduce?1:Math.min(1,dt/300);rot.y+=(gy-rot.y)*e;rot.x-=rot.x*e;
    if(Math.abs(gy-rot.y)<.002&&Math.abs(rot.x)<.002){rot.y=rot.x=0;rot.home=false}
  }
  var sw=reduce?0:1,yaw=depthAmt*(rot.y+tilt.y+sw*.2*Math.sin(now/6500)),pitch=depthAmt*(rot.x+tilt.x+.2+sw*.05*Math.sin(now/8300));
  cyw=Math.cos(yaw);syw=Math.sin(yaw);cpt=Math.cos(pitch);spt=Math.sin(pitch);
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  NODES.forEach(function(n){if(!n.vis)return;n.z+=(n.zt-n.z)*(n.ap<.05?1:Math.min(1,dt/900));x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)});
  var zs=Math.max(160,Math.max(x1-x0,y1-y0)*.85);ZS=ZS?ZS+(zs-ZS)*.05:zs;
  if(x0<x1||y0<y1){var cx1=(x0+x1)/2,cy1=(y0+y1)/2;if(!C)C={x:cx1,y:cy1};else{C.x+=(cx1-C.x)*.1;C.y+=(cy1-C.y)*.1}}
  var kk=Math.max(.7,Math.min(1.6,cam.k)),lo=1e9,hi=-1e9;
  NODES.forEach(function(n){var q=proj(n.x,n.y,n.z);n.px=q[0];n.py=q[1];n.ps=q[2];n.pz=q[3];n.wx=q[4];n.wy=q[5];n.pr=n.r*kk*q[2];
    if(n.vis){lo=Math.min(lo,n.pz);hi=Math.max(hi,n.pz)}});
  NODES.forEach(function(n){n.fz=hi>lo?depthAmt*(n.pz-lo)/(hi-lo):0});   /* fog by the distance from the viewer, not by age, so it stays right from any side */
}
function fogOf(n){return n.fz||0}
function when(t){return new Date(t*1000).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}

/* ---------- history (timeline) ---------- */
function setStep(v,rip){
  v=Math.max(0,Math.min(NC,v));cur=v;
  NODES.forEach(function(n){
    var show=!hidden[n.g]&&(NC===0||n.b<v);
    if(show&&!n.vis){
      var near=adj[n.i].filter(function(m){return m.n.vis});
      if(near.length){   /* sprout outward from a neighbour at about the length of a thread, so the new note does not start inside the others and get kicked away */
        var m=near[Math.floor(hash(n.i)*near.length)].n,ang=(m.x||m.y?Math.atan2(m.y,m.x):hash(n.i+3)*6.2832)+(hash(n.i+3)-.5)*1.8,dist=n.r+m.r+34+hash(n.i+7)*14;
        n.x=m.x+Math.cos(ang)*dist;n.y=m.y+Math.sin(ang)*dist}
      else{n.x=n.x0*.6+(hash(n.i+1)-.5)*20;n.y=n.y0*.6+(hash(n.i+5)-.5)*20}
      n.vx=n.vy=0;n.ap=reduce?1:0;
    }
    n.vis=show;
  });
  NODES.forEach(function(n){n.touch=-1});
  for(var c=0;c<v;c++){var cm=D.commits[c];for(var j=0;j<cm.n.length;j++)NODES[cm.n[j]].touch=c}
  depthTargets();
  if(rip&&!reduce&&v>0){D.commits[v-1].n.forEach(function(i){if(NODES[i].vis)ripples.push({i:i,t:performance.now(),born:D.commits[v-1].a.indexOf(i)>=0})})}
  var sl=document.getElementById("slide");sl.value=v;
  var small=window.matchMedia&&matchMedia("(max-width:640px)").matches;   /* on a phone: "Nov 1 · 5/134" */
  document.getElementById("when").textContent=v>0?(small?new Date(D.commits[v-1].t*1000).toLocaleDateString(undefined,{month:"short",day:"numeric"})+" · "+v+"/"+NC:when(D.commits[v-1].t)+"  ("+v+" / "+NC+")"):"before the first commit";
  document.getElementById("what").textContent=v>0?D.commits[v-1].s:"";
  document.getElementById("stats").textContent=visCount()+" of "+NN+" notes, "+E.filter(edgeVis).length+" links"+(NC?", "+NC+" commits":"");
  alpha=Math.max(alpha,playing&&rip?.1:.4);   /* a replay step only nudges the layout; a jump or a click on the legend re-settles it */
}
function edgeVis(e){return e.a.vis&&e.b.vis}
function visCount(){var c=0;NODES.forEach(function(n){if(n.vis)c++});return c}
function recency(n){
  if(n.touch<0||cur===0)return 0;
  var ref=D.commits[cur-1].t,age=Math.max(0,(ref-D.commits[n.touch].t)/86400);
  return Math.exp(-age/30);
}

/* ---------- physics ---------- */
function tick(){
  var vs=NODES.filter(function(n){return n.vis});if(vs.length===0)return;
  var a=alpha,cell=110,grid={},i,j,calm=playing&&!reduce;   /* calm: during a replay the nodes move slowly and settle, no shaking */
  vs.forEach(function(n){var k=Math.floor(n.x/cell)+","+Math.floor(n.y/cell);(grid[k]=grid[k]||[]).push(n)});
  vs.forEach(function(n){
    var cx0=Math.floor(n.x/cell),cy0=Math.floor(n.y/cell);
    for(var gx=-1;gx<=1;gx++)for(var gy=-1;gy<=1;gy++){
      var bucket=grid[(cx0+gx)+","+(cy0+gy)];if(!bucket)continue;
      for(var q=0;q<bucket.length;q++){
        var m=bucket[q];if(m===n)continue;
        var dx=n.x-m.x,dy=n.y-m.y,d2=dx*dx+dy*dy+.01;
        if(d2<cell*cell){var f=(260+n.r*m.r*5)/(d2+60)*a;n.vx+=dx*f;n.vy+=dy*f}
      }
    }
  });
  E.forEach(function(e){
    if(!e.a.vis||!e.b.vis)return;
    var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.sqrt(dx*dx+dy*dy)+.01,L=40+e.a.r+e.b.r+26/Math.sqrt(e.w);
    var f=(d-L)/d*.05*a*Math.min(2,.6+Math.sqrt(e.w)*.3);
    e.a.vx+=dx*f;e.a.vy+=dy*f;e.b.vx-=dx*f;e.b.vy-=dy*f;
  });

  }
  if(!drag){var i=pick(ev.clientX,ev.clientY);if(i!==hov){hov=i;cv.classList.toggle("hover",i>=0)}return}
  var dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
  if(!drag.moved)return;
  if(drag.turn){turnTo(drag.ry+dx*.005,drag.rx-dy*.005);return}   /* Shift-drag turns the view */
  if(drag.id>=0){var n=NODES[drag.id];
    if(depthAmt>0){n.x=drag.nx+dx*cyw/(cam.k*n.ps);n.y=drag.ny+dy*cpt/(cam.k*n.ps*VS)}   /* turned: follow the finger along the note's own axes */else{var w=world(ev.clientX,ev.clientY);n.x=w.x;n.y=w.y}
    alpha=Math.max(alpha,.35)}
  else{autoFit=false;cam.tx=drag.cx-dx/cam.k;cam.ty=drag.cy-dy/(cam.k*VS);cam.x=cam.tx;cam.y=cam.ty;
    if(depthOn&&!reduce){tilt.y=Math.max(-.3,Math.min(.3,tilt.y+(ev.movementX||0)*.002));tilt.x=Math.max(-.2,Math.min(.2,tilt.x-(ev.movementY||0)*.002))}}   /* a pan tilts the view a little; it springs back */
});
cv.addEventListener("pointercancel",function(ev){endPointer(ev);if(drag&&drag.id>=0)NODES[drag.id].fixed=false;drag=null;cv.classList.remove("drag")});
cv.addEventListener("pointerup",function(ev){
  if(endPointer(ev))return;
  cv.classList.remove("drag");
  if(!drag)return;
  if(drag.id>=0)NODES[drag.id].fixed=false;
  if(!drag.moved){if(drag.id>=0)select(drag.id);else select(-1)}
  drag=null;
});
cv.addEventListener("wheel",function(ev){
  ev.preventDefault();
  /* a sideways two-finger swipe on a trackpad turns the view (with depth); a mouse wheel and a vertical swipe zoom, and so
     does a trackpad pinch (which the browser sends as a wheel with ctrlKey) */
  var px=ev.deltaMode===1?16:ev.deltaMode===2?400:1;
  if(depthOn&&!ev.ctrlKey&&Math.abs(ev.deltaX)>Math.abs(ev.deltaY)){turnTo(rot.y-ev.deltaX*px*.004,rot.x);return}
  autoFit=false;
  var before=world(ev.clientX,ev.clientY),f=Math.exp(-ev.deltaY*.0015);
  cam.tk=Math.max(.12,Math.min(5,cam.tk*f));cam.k=cam.tk;
  var after=world(ev.clientX,ev.clientY);cam.tx+=before.x-after.x;cam.ty+=before.y-after.y;cam.x=cam.tx;cam.y=cam.ty;
},{passive:false});
cv.addEventListener("dblclick",function(){autoFit=true;turnHome()});
document.getElementById("fit").addEventListener("click",function(){autoFit=true;turnHome()});
document.getElementById("theme").addEventListener("click",function(){
  var next=T.dark?"light":"dark";root.setAttribute("data-theme",next);
  try{localStorage.setItem("myco-graph-theme",next)}catch(e){}
  readTheme();
});
var panel=document.getElementById("panel");
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
/* The detail panel can shrink to a strip (title, counts, Open, More) and the search box can fold to the title and counts.
   On a phone the panel starts as a strip; on a larger screen it starts open. A choice made with the buttons is kept in this
   browser (localStorage, if allowed). */
function pref(k,v){try{if(v===undefined)return localStorage.getItem("myco-graph-"+k);localStorage.setItem("myco-graph-"+k,v)}catch(e){return null}}
var panelFull=pref("panel")?pref("panel")==="full":!(window.matchMedia&&matchMedia("(max-width:640px)").matches);
function togglePanel(){setPanelFull(!panelFull);pref("panel",panelFull?"full":"min")}
function setFold(f){var h=document.getElementById("head"),b=document.getElementById("fold");h.classList.toggle("fold",f);b.innerHTML=f?"+":"&minus;";b.setAttribute("aria-expanded",f?"false":"true");b.title=f?"Show the search and the legend":"Hide the search and the legend"}
document.getElementById("fold").addEventListener("click",function(){var f=!document.getElementById("head").classList.contains("fold");setFold(f);pref("head",f?"fold":"open")});
setFold(pref("head")==="fold");
function setPanelFull(f){panelFull=f;panel.classList.toggle("min",!f);var m=document.getElementById("more");if(m){m.textContent=f?"Less":"More";m.setAttribute("aria-expanded",f?"true":"false")}}
function select(i){
  sel=i;
  if(i<0){panel.hidden=true;return}
  var n=NODES[i],g=D.groups[n.g];panel.hidden=false;panel.textContent="";
  var x=el("button",null,"×");x.id="close";x.setAttribute("aria-label","Close");x.addEventListener("click",function(){select(-1)});panel.appendChild(x);
  var h=el("h2",null,n.title);h.addEventListener("click",togglePanel);panel.appendChild(h);panel.appendChild(el("div","rel",n.rel));
  var sum=el("div","sum");   /* the strip: shown on a phone only */
  sum.appendChild(el("span",null,"→ "+n.out+"  ← "+n.in+(n.due?"  · wilting":"")+(n.miss?"  · missing refs":"")));
  var so=el("a",null,"Open →");so.href="p/"+n.id+".html";sum.appendChild(so);
  var mb=el("button",null,"More");mb.id="more";mb.type="button";mb.setAttribute("aria-controls","panel");mb.addEventListener("click",togglePanel);sum.appendChild(mb);
  panel.appendChild(sum);
  var det=el("div","det");panel.appendChild(det);
  var dl=el("dl");
  function row(k,v,cls){dl.appendChild(el("dt",null,k));dl.appendChild(el("dd",cls,v))}
  row("Group",g?g.name:"");
  row("Mentions",n.out+(n.out===1?" note":" notes"));row("Mentioned by",n.in+(n.in===1?" note":" notes"));
  row("Size",n.kb+" KB");
  if(n.l!=null)row("Last changed",when(D.commits[n.l].t)+" - "+D.commits[n.l].s);
  if(n.due)row("Follow-ups",n.due+" past due","warn");
  if(n.miss)row("Missing refs",n.miss.join(", "),"warn");
  if(!n.in&&!n.out)row("Links","none: no note mentions this one");
  det.appendChild(dl);
  var a=el("a","open","Open the note →");a.href="p/"+n.id+".html";det.appendChild(a);
  [["out","Mentions →"],["inn","Mentioned by ←"]].forEach(function(side){
    var list=adj[i].filter(function(m){return m[side[0]]});if(!list.length)return;
    det.appendChild(el("div","side",side[1]));var nb=el("div","nb");
    list.sort(function(p,q){return q.e.w-p.e.w}).slice(0,14).forEach(function(m){
      var b=el("button",null,m.n.name.replace(/\.md$/,""));b.addEventListener("click",function(){select(m.n.i);focusOn(m.n.i)});nb.appendChild(b)});
    det.appendChild(nb)});
  setPanelFull(panelFull);
}
function focusOn(i){var n=NODES[i];autoFit=false;cam.tx=n.wx==null?n.x:n.wx;cam.ty=n.wy==null?n.y:n.wy;cam.tk=Math.max(cam.tk,1.4)}
var q=document.getElementById("q");
q.addEventListener("input",function(){
  var s=q.value.trim().toLowerCase();
  if(!s){match=null;return}
  match={};NODES.forEach(function(n){if(n.low.indexOf(s)>=0)match[n.i]=true});
});
q.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&match){var f=NODES.filter(function(n){return match[n.i]&&n.vis})[0];if(f){select(f.i);focusOn(f.i)}}
  if(ev.key==="Escape"){q.value="";match=null;select(-1)}
});
function paintLegend(){
  var lg=document.getElementById("legend");lg.textContent="";
  D.groups.forEach(function(g,gi){
    var b=el("button","chip"+(hidden[gi]?" off":""));var d=el("i");d.style.background=gcol(gi);b.appendChild(d);b.appendChild(document.createTextNode(g.name));
    b.setAttribute("aria-pressed",hidden[gi]?"false":"true");
    b.addEventListener("click",function(){hidden[gi]=!hidden[gi];setStep(cur,false);paintLegend()});lg.appendChild(b);
  });
}
document.getElementById("find").addEventListener("click",function(){
  var h=document.getElementById("head"),o=h.classList.toggle("open");this.setAttribute("aria-expanded",o?"true":"false");if(o)q.focus();
});
document.getElementById("what").addEventListener("click",function(){this.classList.toggle("full")});
var slide=document.getElementById("slide"),playBtn=document.getElementById("play");
slide.max=NC;
slide.addEventListener("input",function(){stopPlay();setStep(parseInt(slide.value,10),false)});
playBtn.addEventListener("click",function(){playing?stopPlay():startPlay()});
document.addEventListener("keydown",function(ev){
  if(ev.target===q)return;
  if(ev.key===" "&&NC>1){ev.preventDefault();playing?stopPlay():startPlay()}
  if(ev.key==="Escape")select(-1);
});
addEventListener("resize",resize);

var dpq=new URLSearchParams(location.search).get("depth");
depthOn=dpq?dpq!=="0":pref("depth")!=="off";depthAmt=depthOn?1:0;
function paintDepth(){document.getElementById("depth").setAttribute("aria-pressed",depthOn?"true":"false")}
document.getElementById("depth").addEventListener("click",function(){depthOn=!depthOn;turnHome();pref("depth",depthOn?"on":"off");paintDepth();if(autoFit)fitTarget()});
paintDepth();

/* ---------- start ---------- */
pickTheme();readTheme();resize();
if(NN===0){document.getElementById("empty").style.display="flex"}
document.getElementById("time").hidden=NC<2;root.classList.toggle("notime",NC<2);
setStep(NC,false);
NODES.forEach(function(n){n.ap=1});
for(var w=0;w<320;w++){alpha=Math.max(alpha,.2*(w<200));tick()}
alpha=0;fitTarget();cam.x=cam.tx;cam.y=cam.ty;cam.k=cam.tk;NODES.forEach(function(n){n.z=n.zt});project(0,16);fitTarget();cam.x=cam.tx;cam.y=cam.ty;cam.k=cam.tk;project(0,16);
requestAnimationFrame(frame);
if(NC>1&&(location.hash==="#replay"||new URLSearchParams(location.search).get("replay"))){setTimeout(function(){startPlay()},700)}
})();
</script>
</body>
