[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillport"
version = "0.1.2"
description = "Install one skill folder into Claude, Fable, Grok, Cursor, Codex and Copilot paths and catch copy drift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "agent-skills", "cli", "claude", "fable", "grok", "cursor", "copilot", "codex"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/skillport"
Repository = "https://github.com/perron/skillport"
Issues = "https://github.com/perron/skillport/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillport = "skillport.cli:main"

[tool.setuptools.packages.find]
include = ["skillport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
