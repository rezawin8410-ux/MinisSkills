[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "0.1.1"
description = "Static, no-LLM security scanner for untrusted agent skills."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "agent-skills", "cli", "security", "linter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/skillguard"
Repository = "https://github.com/perron/skillguard"
Issues = "https://github.com/perron/skillguard/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillguard = "skillguard.cli:main"

[tool.setuptools.packages.find]
include = ["skillguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
